unbind C-b
set-option -g prefix C-a
bind a send-prefix
bind C-a last-window

bind c new-window
bind n next-window
bind p previous-window

# Emacs-style window (pane) commands with tmux prefix, customised for a
# multi-window workflow where the next window's pane gets pulled into the
# current window as a split rather than spawning a fresh shell:
#   C-a 0  → break current pane out to a new window after this one
#            (emacs C-x 0 closes a window; here we move it sideways)
#   C-a 1  → kill other panes in this window  (emacs C-x 1)
#   C-a 2  → join next window's pane below    (emacs C-x 2 split-below
#            but content comes from window :+ instead of a new shell)
#   C-a 3  → join next window's pane to the right (emacs C-x 3 split-right
#            with content from window :+)
#   C-a o  → select other pane                (emacs C-x o)
# tmux "window" = emacs frame / browser tab; tmux "pane" = emacs window.
# `:+` is "next window in the session" — if you want a specific source
# window, use `C-a :join-pane -h -s :N` directly. If there is no next
# window with a pane, the join fails loudly — same as C-x 3 in emacs
# when there's no buffer to show.
bind 0 break-pane -a
bind 1 kill-pane -a
bind 2 join-pane -v -s :+
bind 3 join-pane -h -s :+
# C-a 4 → fresh shell as a right-side split (the "split-window" sibling
# of C-a 3's join-window-from-the-right behavior). Use this when no
# adjacent window has the pane you want to pull.
bind 4 split-window -h -c "#{pane_current_path}"
bind o select-pane -t :.+

# Window (tab) navigation:
#   M-0..M-9    → select window 0..9 directly (NO prefix — root table)
#   C-a w       → choose-tree (interactive window picker)
#   C-a ,       → rename window
#   C-a &       → kill window with confirm
# `bind -n` puts the binding in the root key table so the prefix isn't
# required. Cost: M-0..M-9 are swallowed by tmux and won't reach apps
# running inside (notably emacs's universal-argument digits). With
# escape-time at 0 a bare Esc followed quickly by a digit also matches —
# acceptable because the muscle memory matches GUI tab-switchers.
bind -n M-0 select-window -t:=0
bind -n M-1 select-window -t:=1
bind -n M-2 select-window -t:=2
bind -n M-3 select-window -t:=3
bind -n M-4 select-window -t:=4
bind -n M-5 select-window -t:=5
bind -n M-6 select-window -t:=6
bind -n M-7 select-window -t:=7
bind -n M-8 select-window -t:=8
bind -n M-9 select-window -t:=9
bind w choose-tree -Zw
bind , command-prompt -I "#W" "rename-window '%%'"
bind & confirm-before -p "kill-window #W? (y/n)" kill-window

# Keep tmux's stock split bindings too so muscle memory still works.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# M-x-style command palette on `prefix ;`: fuzzy-pick over
# `tmux list-commands`, then drop into command-prompt with the chosen
# command pre-filled for args. The plugin must be installed (TPM
# `prefix I`) before this bind works; until then it silently no-ops.
# `;` is escaped because tmux's config parser treats bare `;` as a
# command separator. Overrides tmux's default `last-pane` on `prefix ;`
# — pane cycling lives on `prefix o` already (`select-pane -t :.+`).
# `prefix :` keeps the native `command-prompt` (tmux default).
bind \; run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/command.sh"

# --- Claude-suggested options ---

# Mouse: scroll, click panes/windows, drag to resize, drag to select
set -g mouse on

# Massive scrollback
set -g history-limit 100000

# Kill the ESC delay so emacs/vim feel native
set -sg escape-time 0

# Forward focus events to apps (emacs autorevert, vim FocusGained)
set -g focus-events on

# Enable CSI-u / extended key reporting for modified keys
set -g extended-keys on
set -g extended-keys-format csi-u

# True color/image-capability passthrough for common outer terminals.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -ga terminal-features "xterm-ghostty:RGB:sixel"

# OSC 52 clipboard handoff to xterm
set -g set-clipboard on

# Status/copy-mode keys = emacs (matches editor)
set -g status-keys emacs
setw -g mode-keys emacs

# Number windows/panes from 1 so they line up with the keyboard row
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one closes so 1..N stays contiguous
set -g renumber-windows on

# Per-window resize so a small client doesn't shrink shared sessions
setw -g aggressive-resize on

# Activity highlight in status, no bell popup
setw -g monitor-activity on
set -g visual-activity off

# Active-window tab on the status line: bright teal bg, black text
setw -g window-status-current-style "bg=brightcyan,fg=black,bold"

# Allow terminal image/control protocols to pass through tmux (for Pi image display,
# sixel/Kitty graphics, OSC sequences, etc.).
set -g allow-passthrough on

# Local helper for scheduling literal lines to be sent to tmux panes later.
# Prefix S schedules, Prefix L lists jobs, Prefix C-l cancels by id.
run-shell '~/.tmux/plugins/tmux-send-later/tmux-send-later.tmux'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'jaclu/tmux-menus'

# Enable automatic save/restore (tmux-continuum + tmux-resurrect).
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
# Restore agent panes as agents, not just as shells in the saved cwd. Pi gets
# exact session files from the companion Pi extension; Codex, Claude Code, and
# opencode get exact session ids from hook/plugin-maintained pane options.
set -g @resurrect-processes 'pi "~codex" "~claude" "~opencode"'
set -g @resurrect-hook-post-save-layout '~/.local/bin/tmux-pi-resurrect-post-save'

# If a custom keybinding is ever added that both tmux-fzf and tmux-menus
# could claim, the later `bind` wins in tmux — keep tmux-fzf bindings
# AFTER tmux-menus bindings in this file so tmux-fzf takes precedence.

# Keep TPM's plugin path explicit so install/update helpers work after a
# plain `tmux source-file ~/.tmux.conf`. Load TPM synchronously when present;
# install it once with:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
